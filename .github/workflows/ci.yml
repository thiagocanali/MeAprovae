name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Verify original question bank calculations
        run: python3 scripts/content/check_math_release.py
      - name: Verify editorial math proposals
        run: python3 scripts/content/check_math_review.py
      - name: Production build
        run: npm run build
        env:
          NITRO_PRESET: vercel
      - name: Repeat production build with generated cache
        run: npm run build
        env:
          NITRO_PRESET: vercel

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify migrations and editorial import isolation
        run: bash scripts/test-database.sh
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: disposable-ci-password

  catalog-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: Prepare types
        run: pnpm exec nuxt prepare
      - name: Test editorial API, PostgREST, disposable database and UI
        run: node tests/integration/catalog/run.mjs
      - name: Upload synthetic catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-integration-evidence
          if-no-files-found: ignore
          path: |
            /tmp/meaprovae-catalog-integration-*/result.json
            /tmp/meaprovae-catalog-integration-*/*.png
